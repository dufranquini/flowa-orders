[DEFAULT]
ConnectionType=initiator
ReconnectInterval=2
FileStorePath=store
StartTime=00:00:00
EndTime=00:00:00
UseDataDictionary=N
SocketConnectHost=127.0.0.1
SocketConnectPort=5001
SocketIgnoreProxy=Y
ResetOnDisconnect=Y

# In message logs, replace non-visible SOH with this character
FieldSeparatorInMessageLogs=|

FileLogPath=log
LogoutTimeout=5
ResetOnLogon=Y

[SESSION]
BeginString=FIX.4.4
SenderCompID=ORDER_GENERATOR
TargetCompID=ORDER_ACCUMULATOR
HeartBtInt=30